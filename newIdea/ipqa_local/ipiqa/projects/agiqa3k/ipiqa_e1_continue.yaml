# E1-continue control（调整3）：同 E1@bs32 checkpoint warm start，不加 MSDA
# 协议与 E3-v2 完全一致（30ep / bs32 / 分组LR / seed42 split / 512），
# 仅 local_branch_type="weighted"，用于归因 E3-v2 的 +0.013 是否真的来自 MSDA。
model:
  arch: "ipiqa"
  base_ckpt: ../data/ckpt/clip/openai/resnet/RN50.pt
  input_resolution: 512
  output_dim: 2
  load_finetuned: False
  head_scale: 10.
  use_mlp_head: True
  dropout_rate: 0.5
  freeze_text: True
  qa_token: True

  # --- warm start from same E1@bs32 ---
  warm_start_e1: True
  warm_start_ckpt: "../run/20260819214_E1_weighted_bs32/checkpoint_best.pth"

  # --- ours: local distortion branch ---
  use_local_branch: True
  local_branch_type: "weighted"  # control：不加 MSDA，其余同 E3-v2
  local_hidden_dim: 256
  local_gate_init: -2.0
  local_use_attention: False

  # --- MSDA branch options（weighted 下忽略）---
  ms_num_heads: 4
  ms_mlp_ratio: 2.0
  ms_refine_gate_init: -1.0

dataset:
  data_path: "../data/aigc_qa_3k/mos_joint.xlsx"
  vis_root: "../data/aigc_qa_3k/AGIQA-3K/"
  transform_train:
    name: "image_train_processor"
    cfg:
      image_size: 512
  transform_val:
    name: "image_eval_processor"
    cfg:
      image_size: 512

run:
  task: "agiqa_doublescore"
  resume_ckpt_path: null

  lr_sched: "constant_lr"
  lr_decay_rate: null
  warmup_lr: -1
  warmup_steps: 0
  min_lr: 1e-5

  init_lr: 1e-5
  lr_layer_decay: 1
  weight_decay: 0
  beta2: 0.999

  batch_size: 32
  batch_size_val: 32
  num_worker: 12

  max_epoch: 30
  log_freq: 20
  accum_grad_iters: 1
  grad_norm_clip: null

  split_file: "splits/seed42.json"
  output_dir: "../run"
  tag: "E1_continue"

  evaluate: False
  eval_freq: 1
  save_freq: 5

  amp: True
  device: "cuda"
  distributed: False
  dist_url: "env://"
