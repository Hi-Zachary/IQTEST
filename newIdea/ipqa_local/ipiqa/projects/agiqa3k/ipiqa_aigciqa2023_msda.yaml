# AIGCIQA2023: Full MSDA 单阶段训练（不 staging）
# 直接从 CLIP 初始化训练完整模型，分组 LR，100 epoch 总预算
# - 单阶段：从 CLIP base_ckpt 直接训练（无 warm start）
# - 新增 MSDA refinement 保持随机初始化，用更高学习率训练
# - MSDA 内部 refine gate 从 -2 放到 -1（sigmoid≈0.269），外层 quality gate 保持 -2
# - 30 epoch / batch32 / seed42 固定划分 / 512
model:
  arch: "ipiqa"
  base_ckpt: ../data/ckpt/clip/openai/resnet/RN50.pt
  input_resolution: 512
  output_dim: 2
  load_finetuned: False
  head_scale: 10.
  use_mlp_head: True
  dropout_rate: 0.5
  freeze_text: True
  qa_token: True

  # --- warm start from E1@bs32 ---
  # 单阶段训练：不做两阶段 warm start

  # --- ours: local distortion branch ---
  use_local_branch: True
  local_branch_type: "msda"
  local_hidden_dim: 256
  local_gate_init: -2.0        # 外层 gate 继续保守
  local_use_attention: False   # 仅 weighted 分支使用，msda 下忽略

  # --- MSDA branch options ---
  ms_num_heads: 4
  ms_mlp_ratio: 2.0
  ms_refine_gate_init: -1.0    # 调整2：从 -2 放到 -1

dataset:
  data_path: "../data/aigc_qa_2023/mos_joint_aigciqa2023.xlsx"
  vis_root: "../data/aigc_qa_2023/images/allimg/"
  transform_train:
    name: "image_train_processor"
    cfg:
      image_size: 512
  transform_val:
    name: "image_eval_processor"
    cfg:
      image_size: 512

run:
  task: "agiqa_doublescore"
  resume_ckpt_path: null

  lr_sched: "linear_warmup_cosine_lr"
  lr_decay_rate: null
  warmup_lr: 0
  warmup_steps: 60
  min_lr: 1e-6

  init_lr: 1e-5
  lr_layer_decay: 1
  weight_decay: 0
  beta2: 0.999

  batch_size: 32
  batch_size_val: 32
  num_worker: 12

  max_epoch: 100
  log_freq: 20
  accum_grad_iters: 1
  grad_norm_clip: null

  split_file: "splits/aigciqa2023_seed42.json"
  output_dir: "../run"
  best_criterion: "quality"
  tag: "E3_aigciqa2023"

  evaluate: False
  eval_freq: 1
  save_freq: 5

  amp: True
  device: "cuda"
  distributed: False
  dist_url: "env://"
